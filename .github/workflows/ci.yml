name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
      build:
        runs-on: ubuntu-latest
        needs: test
        steps:
          - name: Get the code
            uses: actions/checkout@v4

          - name: Build Docker image
            run: docker build -t event-pipeline:${{ github.sha }} .

          - name: Smoke test the image
            run: docker run --rm event-pipeline:${{ github.sha }} python -c "import pipeline; print('image works')"